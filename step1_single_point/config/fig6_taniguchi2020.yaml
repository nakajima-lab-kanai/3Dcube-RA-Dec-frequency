# Taniguchi et al. (2020) Fig. 6 照合用設定
# 
# 出典: Taniguchi et al. (2020), PASJ 72(1), 2
# 
# 変更理由の記録:
# - source.peak_k: 1.0 -> 5.0 K
#   (理由: 論文 Fig. 6 および §3.2 では「strong line emission」が想定されており、
#    熱雑音 (Tsys 200 K) および大気変動 (rms 1 K) に対し、復調後に theta_cutoff = 5.0 sigma
#    を明確に超えてモデル化され、PCA による天体信号吸収と 2 回目のフィードバックによる
#    改善効果を明瞭に検証できるようにするため。150 GHz 帯の周波数は維持。)
# - removal.n_components: 1 (大気の共通時間変動の第 1 主成分を除去)
# - removal.mean_mode: none (原点まわり PCA。channel_mean への切替も CLI で可能)

seed: 20261005

source:
  sigma_arcsec: 50.0        # 天体の空間サイズ。ガウシアンの sigma [arcsec]
  line_fwhm_kms: 50.0       # 輝線幅。速度の FWHM [km/s]
  center_freq_ghz: 150.0    # 輝線の中心周波数 [GHz] (150 GHz 帯を維持)
  peak_k: 5.0               # ピーク強度 [K] (Fig. 6 の強輝線条件に設定。元は 1.0 K)
  center_ra_arcsec: 0.0
  center_dec_arcsec: 0.0

cube:
  half_extent_arcsec: 200.0
  pixel_arcsec: 10.0
  margin_ch: 50

pointing:
  ra_arcsec: null           # 天体中心
  dec_arcsec: null

spectrometer:
  n_channels: 4096          # SAM45 想定
  channel_width_mhz: 0.48828125  # 2000 MHz / 4096 ch
  center_freq_ghz: 150.0

modulation:
  pattern: zigzag           # ジグザグ変調
  dt_s: 0.1                 # サンプリング 0.1 s
  half_width_ch: 150        # 変調半幅 +-150 ch
  zigzag_step_ch: 10        # 1 サンプルあたり 10 ch シフト

observation:
  duration_s: 60.0          # 60 秒 (600 サンプル)

noise:
  thermal:
    enabled: true
    tsys_k: 200.0
  atmosphere:
    enabled: true
    model: laminar
    alpha: 1.0
    rms_k: 1.0
    offset_k: 0.0
    slope_frac: 0.1

removal:
  n_components: 1
  mean_mode: none           # none または channel_mean

evaluation:
  line_free_n_fwhm: 2.0     # 輝線中心から +-2.0 FWHM 外側を輝線なし領域とする
